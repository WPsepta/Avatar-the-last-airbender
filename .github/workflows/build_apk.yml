name: Build Android APK (PS2Recomp)

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components (API 34, NDK, CMake)
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Extract Android and Runtime folders
        run: |
          unzip -q android_build.zip
          unzip -q runtime_build.zip

      - name: Merge split zip parts
        run: |
          ls -lh avatar_zip_part_*
          cat avatar_zip_part_* > avatar_output.zip

      - name: Extract generated C++ output
        run: |
          rm -rf /tmp/generated
          mkdir -p /tmp/generated
          unzip -q avatar_output.zip -d /tmp/generated
          test -f /tmp/generated/output/ps2_recompiled_functions.h
          test -f /tmp/generated/output/ps2_recompiled_stubs.h
          test -f /tmp/generated/output/register_functions.cpp

      - name: Integrate generated files into PS2Recomp runtime
        run: |
          set -euxo pipefail
          cp /tmp/generated/output/ps2_recompiled_functions.h ps2xRuntime/include/
          cp /tmp/generated/output/ps2_recompiled_stubs.h ps2xRuntime/include/
          cp /tmp/generated/output/register_functions.cpp ps2xRuntime/src/runner/register_functions.cpp
          cp /tmp/generated/output/sub_*.cpp ps2xRuntime/src/runner/
          cp /tmp/generated/output/entry_*.cpp ps2xRuntime/src/runner/
          echo "Integrated files:"
          ls ps2xRuntime/src/runner | wc -l

      - name: Build release APK
        working-directory: android
        run: |
          gradle assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: avatar-ps2recomp-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
