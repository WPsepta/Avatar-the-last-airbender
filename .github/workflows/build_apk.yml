name: Build Android APK (PS2Recomp)

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK components (API 34, NDK, CMake)
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Install Gradle 8.9
        run: |
          set -euxo pipefail
          GRADLE_VER=8.9
          GRADLE_ZIP="gradle-${GRADLE_VER}-bin.zip"
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-delay 5 -o "/tmp/${GRADLE_ZIP}" \
              "https://services.gradle.org/distributions/${GRADLE_ZIP}"; then
              break
            fi
            echo "Gradle download attempt $i failed, retrying..."
            sleep 10
          done
          test -f "/tmp/${GRADLE_ZIP}"
          unzip -q "/tmp/${GRADLE_ZIP}" -d /tmp/gradle-dist
          echo "/tmp/gradle-dist/gradle-${GRADLE_VER}/bin" >> "$GITHUB_PATH"
          /tmp/gradle-dist/gradle-${GRADLE_VER}/bin/gradle --version | head -5

      - name: Extract final project folder
        run: |
          unzip -oq project_final_v32.zip

      - name: Merge split zip parts (C++ output)
        run: |
          ls -lh avatar_zip_part_*
          cat avatar_zip_part_* > avatar_output.zip

      - name: Extract generated C++ output
        run: |
          rm -rf /tmp/generated
          mkdir -p /tmp/generated
          unzip -q avatar_output.zip -d /tmp/generated

      - name: Integrate generated files into PS2Recomp runtime
        run: |
          set -euxo pipefail
          cp /tmp/generated/output/ps2_recompiled_functions.h ps2xRuntime/include/
          cp /tmp/generated/output/ps2_recompiled_stubs.h ps2xRuntime/include/
          cp /tmp/generated/output/register_functions.cpp ps2xRuntime/src/runner/register_functions.cpp
          cp /tmp/generated/output/sub_*.cpp ps2xRuntime/src/runner/
          cp /tmp/generated/output/entry_*.cpp ps2xRuntime/src/runner/
          echo "Integrated files:"
          ls ps2xRuntime/src/runner | wc -l

      - name: Build release APK
        working-directory: android
        env:
          CMAKE_UNITY_BUILD: "ON"
          CMAKE_UNITY_BUILD_BATCH_SIZE: "50"
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          gradle assembleRelease -Pandroid.injected.build.api=34 --parallel --max-workers=4

      - name: Locate APK
        run: |
          echo "Searching for APK outputs..."
          find android -name "*.apk" -ls || true
          find . -path "*outputs*apk*.apk" -ls || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: avatar-ps2recomp-apk
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/**/release/*.apk
            **/*release*.apk
          if-no-files-found: error
