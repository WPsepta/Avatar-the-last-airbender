plugins {
    id 'com.android.application'
}

// Override with: gradlew assembleRelease -Pps2xBootElf=/absolute/path/on/device.elf
def ps2xBootElf = project.findProperty('ps2xBootElf') ?: '/storage/emulated/0/Android/data/com.avatar.tla/files/SLUS_213.95'

android {
    namespace 'com.avatar.tla'
    compileSdk 34
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.avatar.tla'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        externalNativeBuild {
            cmake {
                arguments '-DPS2X_BUILD_RECOMP=OFF',
                        '-DPS2X_BUILD_ANALYZER=OFF',
                        '-DPS2X_BUILD_TEST=OFF',
                        '-DPS2X_BUILD_STUDIO=OFF',
                        '-DPS2X_ENABLE_SCCACHE=OFF',
                        '-DPS2X_RUNNER_UNITY_BUILD_BATCH_SIZE=80',
                        '-DCMAKE_CXX_FLAGS_RELEASE=-O1 -DNDEBUG',
                        '-DCMAKE_C_FLAGS_RELEASE=-O1 -DNDEBUG',
                        '-DANDROID_STL=c++_shared',
                        '-DANDROID_CPP_FEATURES=rtti exceptions',
                        '-DUSE_VULKAN=OFF',
                        "-DPS2X_DEFAULT_BOOT_ELF=${ps2xBootElf}"
                targets 'ps2EntryRunner'
            }
        }

        ndk {
            // Build arm64-v8a only to stay within GitHub Actions timeout (generated C++ is large).
            abiFilters 'arm64-v8a'
        }
    }

externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release'
                }
            }
        }
        release {
            minifyEnabled false
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release'
                }
            }
        }
    }
}
